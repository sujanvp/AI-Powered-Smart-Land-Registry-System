{% extends 'base.html' %}

{% block title %}Login - AI Smart Land Registry{% endblock %}

{% block content %}
<div class="auth-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 2rem 0;">
    <div class="section-card" style="width: 100%; max-width: 450px; padding: 2.5rem; margin: 0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; background: #fff;">
        <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
            <div class="auth-logo" style="font-size: 2rem; font-weight: 800; color: #1e3a8a; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: 'Outfit', sans-serif;">
                <i class="fa-solid fa-landmark-flag" style="color: #2563eb;"></i> E-Registry
            </div>

        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-element" style="margin-bottom: 1.25rem;">
                <label for="username" style="font-weight: 600; color: #475569; font-size: 0.85rem; margin-bottom: 0.5rem; display: block;">Username</label>
                <input type="text" id="username" name="username" class="gov-input" required autocomplete="username" style="width: 100%; margin: 0;">
            </div>
            
            <div class="form-element" style="margin-bottom: 1.5rem;">
                <label for="password" style="font-weight: 600; color: #475569; font-size: 0.85rem; margin-bottom: 0.5rem; display: block;">Password</label>
                <input type="password" id="password" name="password" class="gov-input" required autocomplete="current-password" style="width: 100%; margin: 0;">
            </div>
            
            <button type="submit" class="btn-action-primary" style="width: 100%; font-size: 1rem; padding: 0.75rem; justify-content: center; font-weight: 700; color: #fff;">
                Sign In
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #475569;">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #2563eb; font-weight: 600; text-decoration: none;">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
