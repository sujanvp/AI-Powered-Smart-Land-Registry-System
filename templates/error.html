{% extends 'base.html' %}

{% block title %}Error - Smart Land Registry{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div class="glass-card" style="padding: 3rem 2rem; border-color: rgba(255, 51, 102, 0.2); background: rgba(255, 51, 102, 0.01);">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: var(--accent-red); margin-bottom: 1.5rem; filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.3));"></i>
        
        <h1 style="font-size: 4rem; font-weight: 900; line-height: 1; margin-bottom: 0.5rem; color: var(--text-primary);">
            {{ error_code }}
        </h1>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: var(--accent-red);">
            {{ error_message }}
        </h2>
        
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6;">
            {{ error_description }}
        </p>
        
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>
            <a href="/" class="btn btn-primary" style="color: #0a0b10;">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
